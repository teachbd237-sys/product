[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# গুরুত্বপূর্ণ: netlify.toml-এর মান Netlify Dashboard-এর একই নামের Variable-কে OVERRIDE করে।
# আগে এখানে NODE_VERSION = "20" ছিল — তাই Dashboard-এ 22 দিলেও প্রতিটি Git Deploy আবার Node 20 হয়ে
# Functions ক্র্যাশ করত। Netlify Functions-এর Runtime ডিফল্টভাবে এই Build Node ভার্সন থেকেই ঠিক হয়।
# (.nvmrc ও package.json "engines" একই ভার্সন বলে — তিন জায়গায় মিল রাখুন।)
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# React Router: যেকোনো লিংকে Refresh করলে index.html দেখাবে (Netlify Function ও আসল ফাইল আগে পায়)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
